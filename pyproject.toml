[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-lake"
version = "0.1.0"
description = "Unified receipt ledger. The HTTP server is the optional serve extra."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-4.0" }
authors = [{ name = "SZL Holdings" }]

[project.optional-dependencies]
serve = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[tool.setuptools]
py-modules = [
  "szl_lake_client",
  "szl_lake_query",
  "szl_lake_receipt",
  "szl_lake_server",
  "szl_lake_store",
]
