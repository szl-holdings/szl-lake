name: HF dataset contract

on:
  pull_request:
    paths:
      - "data/**"
      - "huggingface/README.md"
      - "LICENSE"
      - "scripts/publish_hf_dataset.py"
      - "scripts/test_publish_hf_dataset.py"
      - "scripts/test_hf_dataset_contract.py"
      - ".github/workflows/hf-dataset-contract.yml"
      - ".github/workflows/hf-sync.yml"
  push:
    branches: [main, master]
    paths:
      - "data/**"
      - "huggingface/README.md"
      - "LICENSE"
      - "scripts/publish_hf_dataset.py"
      - "scripts/test_publish_hf_dataset.py"
      - "scripts/test_hf_dataset_contract.py"
      - ".github/workflows/hf-dataset-contract.yml"
      - ".github/workflows/hf-sync.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install contract dependencies
        run: pip install --quiet "pyarrow>=16,<22" "PyYAML>=6,<7" "huggingface_hub==1.23.0"
      - name: Reject a stale or malformed checked source index
        run: python scripts/publish_hf_dataset.py --check-index
      - name: Test atomic publication and complete-tree readback
        env:
          PYTHONPATH: scripts
        run: python scripts/test_publish_hf_dataset.py
      - name: Validate card metadata, viewer schema, and empty chains
        run: python scripts/test_hf_dataset_contract.py

