name: Lake receipt spine

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: lake-receipt-spine-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  receipt-spine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the pinned attestation extra and test runner
        run: python -m pip install -r requirements-attest.txt "pytest==8.3.5"
      - name: Verify signed receipts and subject and digest bindings
        run: |
          # Fail if the optional library cannot import; do not silently skip.
          python -c "import szl_receipt"
          python -m pytest scripts/test_lake_receipt_spine.py -q
