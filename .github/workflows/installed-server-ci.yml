name: Installed lake server

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  serve:
    name: Installed serve extra (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the serve extra and HTTP test dependencies
        run: |
          python -m pip install ".[serve]" pytest httpx
          python -m pip check
      - name: Exercise the existing suite with HTTP dependencies present
        run: python -m pytest -q tests
      - name: Verify the installed server outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -I "$GITHUB_WORKSPACE/scripts/check_installed_server.py"
